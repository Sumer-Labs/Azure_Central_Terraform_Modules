name: Platform PR

on:
  workflow_call:
    inputs:
      application_id:
        description: Application identifier
        required: true
        type: string

      environment:
        description: Deployment environment
        required: true
        type: string

      base_sha:
        description: Base commit SHA of the pull request
        required: true
        type: string

      head_sha:
        description: Head commit SHA of the pull request
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

      PLATFORM_REPO_TOKEN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:

  # --------------------------------------------------
  # Detect Terraform changes
  # --------------------------------------------------
  detect-terraform:
    name: Detect Terraform Changes
    runs-on: ubuntu-latest

    outputs:
      terraform_changed: ${{ steps.detect.outputs.terraform_changed }}

    steps:

      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: Sumer-Labs/Azure_Central_Terraform_Modules
          ref: main
          path: platform
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}

      - name: Detect Terraform changes
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          chmod +x platform/.github/scripts/detect-terraform-changes.sh

          platform/.github/scripts/detect-terraform-changes.sh


  # --------------------------------------------------
  # Terraform CI
  # --------------------------------------------------
  terraform-ci:
    name: Terraform CI
    needs: detect-terraform

    if: ${{ needs.detect-terraform.outputs.terraform_changed == 'true' }}

    uses: Sumer-Labs/Azure_Central_Terraform_Modules/.github/workflows/terraform-ci.yml@main

    with:
      application_id: ${{ inputs.application_id }}
      environment: ${{ inputs.environment }}

    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}


  # --------------------------------------------------
  # Platform PR Gate
  # --------------------------------------------------
  platform-pr-gate:
    name: Platform PR Gate

    needs:
      - detect-terraform
      - terraform-ci

    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:

      - name: Evaluate Platform PR
        shell: bash
        run: |
          echo "======================================"
          echo "Platform PR Gate"
          echo "======================================"

          echo "Terraform Changed : ${{ needs.detect-terraform.outputs.terraform_changed }}"
          echo "Terraform CI      : ${{ needs.terraform-ci.result }}"

          echo "======================================"

          if [[ "${{ needs.detect-terraform.outputs.terraform_changed }}" == "true" ]]; then

            if [[ "${{ needs.terraform-ci.result }}" != "success" ]]; then
              echo ""
              echo "❌ Platform PR Gate FAILED."
              echo "Terraform changes were detected but Terraform CI did not pass."
              exit 1
            fi

            echo ""
            echo "✅ Terraform CI passed."

          else

            echo ""
            echo "ℹ️ No Terraform changes detected."
            echo "Terraform CI is not required for this PR."

          fi

          echo ""
          echo "✅ Platform PR Gate PASSED."