name: Terraform Security

on:
  workflow_call:
    inputs:
      application_id:
        description: Application identifier
        required: true
        type: string

      environment:
        description: Deployment environment
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

      PLATFORM_REPO_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  security:
    name: Terraform Security - Checkov
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout application repository
      # --------------------------------------------------
      - name: Checkout application repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Run Checkov
      # --------------------------------------------------
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: Infra
          framework: terraform
          quiet: false
