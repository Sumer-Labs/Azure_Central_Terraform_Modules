name: Terraform CI

on:
  workflow_call:
    inputs:
      application_id:
        description: Application identifier
        required: true
        type: string

      environment:
        description: Deployment environment
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

      PLATFORM_REPO_TOKEN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:

  # --------------------------------------------------
  # Terraform validation
  # --------------------------------------------------
  validate:
    name: Terraform Validate

    uses: Sumer-Labs/Azure_Central_Terraform_Modules/.github/workflows/ci-terraform-validate.yml@main

    with:
      application_id: ${{ inputs.application_id }}
      environment: ${{ inputs.environment }}

    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
