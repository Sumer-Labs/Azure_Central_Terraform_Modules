name: Platform Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md

permissions:
  contents: write

jobs:
  release:
    name: Create Platform Release
    runs-on: ubuntu-latest

    environment:
      name: platform-release

    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md || true)

          if [ -z "$VERSION" ]; then
            echo "No valid release version found in CHANGELOG.md"
            exit 1
          fi

          echo "Detected release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi

          echo "Release version format is valid: $VERSION"

      - name: Check whether release already exists
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="platform-v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')

            echo "Release $TAG already exists."
            echo "Draft status: $IS_DRAFT"

            if [ "$IS_DRAFT" = "true" ]; then
              echo "A draft release exists. Continuing with verification."
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "existing_draft=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release is already published."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "existing_draft=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release $TAG does not exist."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "existing_draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if release already exists
        if: steps.release_check.outputs.skip == 'true'
        run: |
          echo "Platform release already exists."
          echo "No new release will be created."

      - name: Determine release commit
        if: steps.release_check.outputs.skip == 'false' 
        id: release_commit
        shell: bash
        run: |
          MAIN_SHA=$(git rev-parse HEAD)

          echo "Release commit:"
          echo "$MAIN_SHA"

          echo "sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Create draft platform release
        if: steps.release_check.outputs.skip == 'false'  && steps.release_check.outputs.existing_draft != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="platform-v${VERSION}"
          MAIN_SHA="${{ steps.release_commit.outputs.sha }}"

          echo "Creating draft release:"
          echo "Version : $VERSION"
          echo "Tag     : $TAG"
          echo "Commit  : $MAIN_SHA"

          gh release create "$TAG" \
            --target "$MAIN_SHA" \
            --title "Platform v${VERSION}" \
            --notes-file CHANGELOG.md \
            --draft

      
      - name: Publish immutable platform release
        if: steps.release_check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="platform-v${VERSION}"

          echo "Publishing release: $TAG"

          gh release edit "$TAG" \
            --draft=false

          echo "Platform release published successfully."

      - name: Verify release tag points to release commit
        if: steps.release_check.outputs.skip == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="platform-v${VERSION}"
          EXPECTED_SHA="${{ steps.release_commit.outputs.sha }}"

          echo "Fetching release tag..."
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"

          ACTUAL_SHA=$(git rev-list -n 1 "$TAG")

          echo "Expected commit: $EXPECTED_SHA"
          echo "Actual commit:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: Release tag does not point to the expected commit."
            exit 1
          fi

          echo "Release tag correctly points to the expected commit."


      - name: Verify immutable release
        if: steps.release_check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="platform-v${VERSION}"

          IMMUTABLE=$(gh release view "$TAG" --json isImmutable --jq '.isImmutable')

          echo "Release:   $TAG"
          echo "Immutable: $IMMUTABLE"

          if [ "$IMMUTABLE" != "true" ]; then
            echo "ERROR: Release was published but is not immutable."
            exit 1
          fi

          echo "Release is confirmed immutable."

      - name: Display release information
        if: steps.release_check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="platform-v${VERSION}"
          MAIN_SHA="${{ steps.release_commit.outputs.sha }}"

          echo "======================================"
          echo "Platform Release Created"
          echo "======================================"
          echo "Version   : $VERSION"
          echo "Tag       : $TAG"
          echo "Commit    : $MAIN_SHA"
          echo "Immutable : true"
          echo "======================================"